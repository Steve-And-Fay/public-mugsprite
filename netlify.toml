[build]
  command = "npx --yes --package=github:Steve-And-Fay/public-internet-crafters-client#main -c 'ic-client install netlify --target ./netlify/edge-functions --force && ic-client doctor netlify --target ./netlify/edge-functions' && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npm run dev:vite"
  port = 8888
  targetPort = 5173
  framework = "vite"

[functions]
  node_bundler = "esbuild"

[[edge_functions]]
  path = "/api/stream/*"
  function = "stream"

[[edge_functions]]
  path = "/api/track/pageview"
  function = "track-pageview"

[[edge_functions]]
  path = "/api/track/ping"
  function = "track-ping"

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/api/rooms"
  to = "/.netlify/functions/rooms"
  status = 200

[[redirects]]
  from = "/api/rooms/*"
  to = "/.netlify/functions/rooms/:splat"
  status = 200

[[redirects]]
  from = "/api/agents/*"
  to = "/.netlify/functions/agents/:splat"
  status = 200

[[redirects]]
  from = "/sponsor/click"
  to = "/.netlify/functions/sponsor/click"
  status = 200

[[redirects]]
  from = "/api/admin/stats"
  to = "/.netlify/functions/admin/stats"
  status = 200

# Manual trigger for the scheduled cleanup function. Daily schedule is set
# via `export const config = { schedule: "@daily" }` inside the function.
[[redirects]]
  from = "/__cleanup"
  to = "/.netlify/functions/cleanup"
  status = 200

[[redirects]]
  from = "/rules"
  to = "/.netlify/functions/rules"
  status = 200

[[redirects]]
  from = "/rules.json"
  to = "/.netlify/functions/rules"
  status = 200

[[redirects]]
  from = "/llms.txt"
  to = "/.netlify/functions/llms"
  status = 200

[[redirects]]
  from = "/r/*/llms.txt"
  to = "/.netlify/functions/llms?room=:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # NOTE: Content-Security-Policy lives in public/_headers so it only ships
    # with the production build. Applying it here would break `netlify dev`,
    # because Vite injects an inline React Fast Refresh preamble script.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
