[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev:vite"
  port = 8888
  targetPort = 5173
  framework = "vite"

[functions]
  node_bundler = "esbuild"

[[edge_functions]]
  path = "/api/stream/*"
  function = "stream"

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200

[[redirects]]
  from = "/api/rooms"
  to = "/.netlify/functions/rooms"
  status = 200

[[redirects]]
  from = "/api/rooms/*"
  to = "/.netlify/functions/rooms/:splat"
  status = 200

[[redirects]]
  from = "/api/agents/*"
  to = "/.netlify/functions/agents/:splat"
  status = 200

[[redirects]]
  from = "/sponsor/click"
  to = "/.netlify/functions/sponsor/click"
  status = 200

# Manual trigger for the scheduled cleanup function. Daily schedule is set
# via `export const config = { schedule: "@daily" }` inside the function.
[[redirects]]
  from = "/__cleanup"
  to = "/.netlify/functions/cleanup"
  status = 200

[[redirects]]
  from = "/rules"
  to = "/.netlify/functions/rules"
  status = 200

[[redirects]]
  from = "/rules.json"
  to = "/.netlify/functions/rules"
  status = 200

[[redirects]]
  from = "/llms.txt"
  to = "/.netlify/functions/llms"
  status = 200

[[redirects]]
  from = "/r/*/llms.txt"
  to = "/.netlify/functions/llms?room=:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
